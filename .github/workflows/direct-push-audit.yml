name: Direct push audit

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require an associated merged PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUSH_REPO: ${{ github.repository }}
          PUSH_SHA: ${{ github.sha }}
          PUSH_REF: ${{ github.ref_name }}
        # 同 ci.yml：经 env 传，不做 shell 插值
        run: >-
          python scripts/audit_github_push.py
          --repo "$PUSH_REPO"
          --sha "$PUSH_SHA"
          --ref "$PUSH_REF"
