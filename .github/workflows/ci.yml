name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [test]

permissions:
  actions: read
  checks: read
  contents: read
  deployments: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reuse-evidence:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'test' &&
      github.base_ref == 'main'
    runs-on: ubuntu-24.04
    outputs:
      reusable: ${{ steps.gate.outputs.reusable }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check out trusted evidence verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted-controller
          persist-credentials: false
      - name: Verify tree-bound test evidence
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          EVIDENCE_REPO: ${{ github.repository }}
        run: |
          tree_sha=$(git rev-parse "$SOURCE_SHA^{tree}")
          if python3 .trusted-controller/scripts/verify_github_release_evidence.py \
            --repo "$EVIDENCE_REPO" --source-sha "$SOURCE_SHA" --tree-sha "$tree_sha" \
            --checkout "$GITHUB_WORKSPACE" \
            >evidence-result.json
          then
            echo "reusable=true" >>"$GITHUB_OUTPUT"
            cat evidence-result.json
          else
            echo "reusable=false" >>"$GITHUB_OUTPUT"
            echo "Evidence unavailable or mismatched; full PR verification is required."
          fi

  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # 标题、分支名经 env 传入，不做 shell 插值：${{ }} 会把值直接拼进命令行，
      # 一个带双引号的标题就能把它拆坏（2026-10-01 实际发生），
      # 而带 `"; …` 的标题能在 CI 里执行任意命令。
      - name: Validate branch, PR and commit policy
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD: ${{ github.head_ref }}
          PR_BASE: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: >-
          python scripts/check_repo_policy.py
          --head "$PR_HEAD"
          --base "$PR_BASE"
          --title "$PR_TITLE"
          --check-commits
      - name: Validate test integration commit
        if: github.event_name == 'push'
        run: >-
          python scripts/check_repo_policy.py
          --head test
          --subject "$(git log -1 --format=%s)"

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Scan tracked files
        run: python scripts/check_secrets.py

  test:
    needs: reuse-evidence
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install uv
        if: needs.reuse-evidence.outputs.reusable != 'true'
        run: python3 -m pip install uv==0.12.10
      - name: Sync locked environment
        if: needs.reuse-evidence.outputs.reusable != 'true'
        run: uv sync --locked --group ml-research
      - name: Run full suite
        if: needs.reuse-evidence.outputs.reusable != 'true'
        run: uv run pytest
      - name: Reuse full-suite evidence for the identical tree
        if: needs.reuse-evidence.outputs.reusable == 'true'
        run: echo "Full suite already passed for this exact tree; reusable evidence verified."

  package:
    needs: reuse-evidence
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install uv
        if: needs.reuse-evidence.outputs.reusable != 'true'
        run: python3 -m pip install uv==0.12.10
      - name: Build wheel and source distribution
        if: needs.reuse-evidence.outputs.reusable != 'true'
        run: uv build
      - name: Import package from source tree
        if: needs.reuse-evidence.outputs.reusable != 'true'
        run: PYTHONPATH=src python3 -c "import qsys"
      - name: Reuse package evidence for the identical tree
        if: needs.reuse-evidence.outputs.reusable == 'true'
        run: echo "Package checks already passed for this exact tree; reusable evidence verified."
