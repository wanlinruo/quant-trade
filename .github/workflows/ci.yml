name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [test]

permissions:
  actions: read
  checks: read
  contents: read
  deployments: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reuse-evidence:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'test' &&
      github.base_ref == 'main'
    # QSYS_CI_RUNNER_LABELS is enabled only after the dedicated runner is online.
    # Fork PRs always stay on GitHub-hosted infrastructure while the repository
    # is public; they must never execute on the persistent qsys-ci host.
    runs-on: >-
      ${{ fromJSON(
        ((github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) &&
         vars.QSYS_CI_RUNNER_LABELS != '' &&
         vars.QSYS_CI_RUNNER_LABELS) ||
        '"ubuntu-24.04"'
      ) }}
    timeout-minutes: 15
    outputs:
      reusable: ${{ steps.gate.outputs.reusable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check out trusted evidence verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted-controller
          persist-credentials: false
      - name: Verify tree-bound test evidence
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          EVIDENCE_REPO: ${{ github.repository }}
        run: |
          tree_sha=$(git rev-parse "$SOURCE_SHA^{tree}")
          if python3 .trusted-controller/scripts/verify_github_release_evidence.py \
            --repo "$EVIDENCE_REPO" --source-sha "$SOURCE_SHA" --tree-sha "$tree_sha" \
            --checkout "$GITHUB_WORKSPACE" \
            >evidence-result.json
          then
            echo "reusable=true" >>"$GITHUB_OUTPUT"
            cat evidence-result.json
          else
            echo "reusable=false" >>"$GITHUB_OUTPUT"
            echo "Evidence unavailable or mismatched; full PR verification is required."
          fi

  policy:
    runs-on: >-
      ${{ fromJSON(
        ((github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) &&
         vars.QSYS_CI_RUNNER_LABELS != '' &&
         vars.QSYS_CI_RUNNER_LABELS) ||
        '"ubuntu-24.04"'
      ) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # 标题、分支名经 env 传入，不做 shell 插值：${{ }} 会把值直接拼进命令行，
      # 一个带双引号的标题就能把它拆坏（2026-10-01 实际发生），
      # 而带 `"; …` 的标题能在 CI 里执行任意命令。
      - name: Validate branch, PR and commit policy
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD: ${{ github.head_ref }}
          PR_BASE: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: >-
          python scripts/check_repo_policy.py
          --head "$PR_HEAD"
          --base "$PR_BASE"
          --title "$PR_TITLE"
          --check-commits
      - name: Validate test integration commit
        if: github.event_name != 'pull_request'
        run: >-
          python scripts/check_repo_policy.py
          --head test
          --subject "$(git log -1 --format=%s)"

  secret-scan:
    runs-on: >-
      ${{ fromJSON(
        ((github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) &&
         vars.QSYS_CI_RUNNER_LABELS != '' &&
         vars.QSYS_CI_RUNNER_LABELS) ||
        '"ubuntu-24.04"'
      ) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Scan tracked files
        run: python scripts/check_secrets.py

  test:
    needs: reuse-evidence
    if: always()
    runs-on: >-
      ${{ fromJSON(
        ((github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) &&
         vars.QSYS_CI_RUNNER_LABELS != '' &&
         vars.QSYS_CI_RUNNER_LABELS) ||
        '"ubuntu-24.04"'
      ) }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install uv
        if: needs.reuse-evidence.outputs.reusable != 'true'
        run: python3 -m pip install uv==0.12.10
      - name: Sync locked environment
        if: needs.reuse-evidence.outputs.reusable != 'true'
        run: uv sync --locked
      - name: Run full suite
        if: needs.reuse-evidence.outputs.reusable != 'true'
        run: uv run pytest
      - name: Reuse full-suite evidence for the identical tree
        if: needs.reuse-evidence.outputs.reusable == 'true'
        run: echo "Full suite already passed for this exact tree; reusable evidence verified."

  package:
    needs: reuse-evidence
    if: always()
    runs-on: >-
      ${{ fromJSON(
        ((github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) &&
         vars.QSYS_CI_RUNNER_LABELS != '' &&
         vars.QSYS_CI_RUNNER_LABELS) ||
        '"ubuntu-24.04"'
      ) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install uv
        if: needs.reuse-evidence.outputs.reusable != 'true'
        run: python3 -m pip install uv==0.12.10
      - name: Build wheel and source distribution
        if: needs.reuse-evidence.outputs.reusable != 'true'
        run: uv build
      - name: Import package from source tree
        if: needs.reuse-evidence.outputs.reusable != 'true'
        run: PYTHONPATH=src python3 -c "import qsys"
      - name: Build Research Runner release manifest
        if: github.event_name != 'pull_request'
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python scripts/build_research_release.py build
          --sha "$SOURCE_SHA" --dist dist --output research-release
          --repository "$SOURCE_REPOSITORY"
          --run-id "$SOURCE_RUN_ID" --run-attempt "$SOURCE_RUN_ATTEMPT"
      - name: Build catalog verifier release manifest
        if: github.event_name != 'pull_request'
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python scripts/build_component_release.py build
          --sha "$SOURCE_SHA" --component catalog-verify
          --dist dist --output catalog-verify-release
          --repository "$SOURCE_REPOSITORY"
          --run-id "$SOURCE_RUN_ID" --run-attempt "$SOURCE_RUN_ATTEMPT"
      - name: Build backtest worker release manifest
        if: github.event_name != 'pull_request'
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python scripts/build_component_release.py build
          --sha "$SOURCE_SHA" --component backtest-worker
          --dist dist --output backtest-worker-release
          --repository "$SOURCE_REPOSITORY"
          --run-id "$SOURCE_RUN_ID" --run-attempt "$SOURCE_RUN_ATTEMPT"
      - name: Build Web release manifest
        if: github.event_name != 'pull_request'
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python scripts/build_component_release.py build
          --sha "$SOURCE_SHA" --component web
          --dist dist --output web-release
          --repository "$SOURCE_REPOSITORY"
          --run-id "$SOURCE_RUN_ID" --run-attempt "$SOURCE_RUN_ATTEMPT"
      - name: Build service checks release manifest
        if: github.event_name != 'pull_request'
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python scripts/build_component_release.py build
          --sha "$SOURCE_SHA" --component service-checks
          --dist dist --output service-checks-release
          --repository "$SOURCE_REPOSITORY"
          --run-id "$SOURCE_RUN_ID" --run-attempt "$SOURCE_RUN_ATTEMPT"
      - name: Build storage report release manifest
        if: github.event_name != 'pull_request'
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python scripts/build_component_release.py build
          --sha "$SOURCE_SHA" --component storage-report
          --dist dist --output storage-report-release
          --repository "$SOURCE_REPOSITORY"
          --run-id "$SOURCE_RUN_ID" --run-attempt "$SOURCE_RUN_ATTEMPT"
      - name: Build daily digest release manifest
        if: github.event_name != 'pull_request'
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python scripts/build_component_release.py build
          --sha "$SOURCE_SHA" --component daily-digest
          --dist dist --output daily-digest-release
          --repository "$SOURCE_REPOSITORY"
          --run-id "$SOURCE_RUN_ID" --run-attempt "$SOURCE_RUN_ATTEMPT"
      - name: Build daily archive release manifest
        if: github.event_name != 'pull_request'
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python scripts/build_component_release.py build
          --sha "$SOURCE_SHA" --component daily-archive
          --dist dist --output daily-archive-release
          --repository "$SOURCE_REPOSITORY"
          --run-id "$SOURCE_RUN_ID" --run-attempt "$SOURCE_RUN_ATTEMPT"
      - name: Build premarket limits release manifest
        if: github.event_name != 'pull_request'
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python scripts/build_component_release.py build
          --sha "$SOURCE_SHA" --component premarket-limits
          --dist dist --output premarket-limits-release
          --repository "$SOURCE_REPOSITORY"
          --run-id "$SOURCE_RUN_ID" --run-attempt "$SOURCE_RUN_ATTEMPT"
      - name: Build Tushare sync release manifest
        if: github.event_name != 'pull_request'
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python scripts/build_component_release.py build
          --sha "$SOURCE_SHA" --component tushare-sync
          --dist dist --output tushare-sync-release
          --repository "$SOURCE_REPOSITORY"
          --run-id "$SOURCE_RUN_ID" --run-attempt "$SOURCE_RUN_ATTEMPT"
      - name: Build health observer release manifest
        if: github.event_name != 'pull_request'
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python scripts/build_component_release.py build
          --sha "$SOURCE_SHA" --component health-observer
          --dist dist --output health-observer-release
          --repository "$SOURCE_REPOSITORY"
          --run-id "$SOURCE_RUN_ID" --run-attempt "$SOURCE_RUN_ATTEMPT"
      - name: Upload immutable Research Runner release
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qsys-research-${{ github.sha }}
          path: research-release
          if-no-files-found: error
          retention-days: 30
      - name: Upload immutable catalog verifier release
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qsys-catalog-verify-${{ github.sha }}
          path: catalog-verify-release
          if-no-files-found: error
          retention-days: 30
      - name: Upload immutable backtest worker release
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qsys-backtest-worker-${{ github.sha }}
          path: backtest-worker-release
          if-no-files-found: error
          retention-days: 30
      - name: Upload immutable Web release
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qsys-web-${{ github.sha }}
          path: web-release
          if-no-files-found: error
          retention-days: 30
      - name: Upload immutable service checks release
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qsys-service-checks-${{ github.sha }}
          path: service-checks-release
          if-no-files-found: error
          retention-days: 30
      - name: Upload immutable storage report release
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qsys-storage-report-${{ github.sha }}
          path: storage-report-release
          if-no-files-found: error
          retention-days: 30
      - name: Upload immutable daily digest release
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qsys-daily-digest-${{ github.sha }}
          path: daily-digest-release
          if-no-files-found: error
          retention-days: 30
      - name: Upload immutable daily archive release
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qsys-daily-archive-${{ github.sha }}
          path: daily-archive-release
          if-no-files-found: error
          retention-days: 30
      - name: Upload immutable premarket limits release
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qsys-premarket-limits-${{ github.sha }}
          path: premarket-limits-release
          if-no-files-found: error
          retention-days: 30
      - name: Upload immutable Tushare sync release
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qsys-tushare-sync-${{ github.sha }}
          path: tushare-sync-release
          if-no-files-found: error
          retention-days: 30
      - name: Upload immutable health observer release
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qsys-health-observer-${{ github.sha }}
          path: health-observer-release
          if-no-files-found: error
          retention-days: 30
      - name: Reuse package evidence for the identical tree
        if: needs.reuse-evidence.outputs.reusable == 'true'
        run: echo "Package checks already passed for this exact tree; reusable evidence verified."
