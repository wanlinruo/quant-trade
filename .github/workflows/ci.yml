name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [test]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate branch, PR and commit policy
        if: github.event_name == 'pull_request'
        run: >-
          python scripts/check_repo_policy.py
          --head "${{ github.head_ref }}"
          --base "${{ github.base_ref }}"
          --title "${{ github.event.pull_request.title }}"
          --check-commits
      - name: Validate test integration commit
        if: github.event_name == 'push'
        run: >-
          python scripts/check_repo_policy.py
          --head test
          --subject "$(git log -1 --format=%s)"

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Scan tracked files
        run: python scripts/check_secrets.py

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install uv
        run: python3 -m pip install uv==0.12.10
      - name: Sync locked environment
        run: uv sync --locked
      - name: Run full suite
        run: uv run pytest

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install uv
        run: python3 -m pip install uv==0.12.10
      - name: Build wheel and source distribution
        run: uv build
      - name: Import package from source tree
        run: PYTHONPATH=src python3 -c "import qsys"
