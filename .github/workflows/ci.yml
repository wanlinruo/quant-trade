name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [test]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # 标题、分支名经 env 传入，不做 shell 插值：${{ }} 会把值直接拼进命令行，
      # 一个带双引号的标题就能把它拆坏（2026-10-01 实际发生），
      # 而带 `"; …` 的标题能在 CI 里执行任意命令。
      - name: Validate branch, PR and commit policy
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD: ${{ github.head_ref }}
          PR_BASE: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: >-
          python scripts/check_repo_policy.py
          --head "$PR_HEAD"
          --base "$PR_BASE"
          --title "$PR_TITLE"
          --check-commits
      - name: Validate test integration commit
        if: github.event_name == 'push'
        run: >-
          python scripts/check_repo_policy.py
          --head test
          --subject "$(git log -1 --format=%s)"

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Scan tracked files
        run: python scripts/check_secrets.py

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install uv
        run: python3 -m pip install uv==0.12.10
      - name: Sync locked environment
        run: uv sync --locked
      - name: Run full suite
        run: uv run pytest

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install uv
        run: python3 -m pip install uv==0.12.10
      - name: Build wheel and source distribution
        run: uv build
      - name: Import package from source tree
        run: PYTHONPATH=src python3 -c "import qsys"
