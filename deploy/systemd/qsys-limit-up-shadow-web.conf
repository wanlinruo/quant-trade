# Installed as /etc/systemd/system/qsys-monitor.service.d/limit-up-shadow.conf.
[Service]
ExecStart=
ExecStart=/home/ubuntu/qsys/.venv/bin/python scripts/run_monitor.py --host 127.0.0.1 --port 8420 --warehouse /home/ubuntu/qsys/warehouse --state /home/ubuntu/qsys/var/shadow-state.sqlite3 --limit-up-shadow-state /data/qsys/var-prod/limit-up-shadow.sqlite3
ReadOnlyPaths=/data/qsys/var-prod
