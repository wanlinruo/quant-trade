# Installed as /etc/systemd/system/qsys-monitor.service.d/zz-limit-up-shadow.conf.
# The zz prefix intentionally loads after the site's strategy-run-log.conf,
# whose ExecStart reset would otherwise remove the shadow-state argument.
[Service]
ExecStart=
ExecStart=/home/ubuntu/qsys/.venv/bin/python scripts/run_monitor.py --host 127.0.0.1 --port 8420 --warehouse /home/ubuntu/qsys/warehouse --state /home/ubuntu/qsys/var/shadow-state.sqlite3 --limit-up-shadow-state /data/qsys/var-prod/limit-up-shadow.sqlite3 --limit-up-research-run /data/qsys/research/issue-210/run-20261010
ReadOnlyPaths=/data/qsys/var-prod /data/qsys/research/issue-210/run-20261010
