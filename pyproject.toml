[project]
name = "qsys"
version = "0.1.0"
description = "Personal quantitative trading system"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    "pydantic>=2.0",
    "structlog>=24.1",
    "akshare>=1.13",
    "mootdx>=0.11",
    "redis>=5.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "fastexcel>=0.12",
    "baostock>=0.8.9",
    "requests>=2.31",
    # 已晋级模型的日常影子评分属于生产运行链路，不再只是研究依赖。
    "lightgbm>=4.5,<5",
    "scikit-learn>=1.5,<2",
]

[project.scripts]
qsys-catalog-verify = "qsys.data.catalog_verify_cli:main"
qsys-research-runner = "qsys.research.runner_cli:main"
qsys-research-test-drill = "qsys.research.drill_cli:main"
qsys-warehouse-snapshot = "qsys.data.snapshot_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    # 测试直接 import，不依赖 akshare/mootdx 的传递依赖
    "pandas>=2.0",
    "numpy>=1.26",
    # mootdx 把 httpx 钉在 <0.26，此处只要下界，由解析器取交集
    "httpx>=0.25",
]
joinquant = [
    "jqdatasdk==1.9.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qsys"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# 让测试始终跑本 checkout 的 src，不依赖 .venv 里 editable 安装指向哪个副本。
# 多 checkout / worktree 下这是正确性要求，不是便利设置。
pythonpath = [".", "src"]
