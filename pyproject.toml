[project]
name = "qsys"
version = "0.1.0"
description = "Personal quantitative trading system"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    "pydantic>=2.0",
    "structlog>=24.1",
    "akshare>=1.13",
    "mootdx>=0.11",
    "redis>=5.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "fastexcel>=0.12",
    "baostock>=0.8.9",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    # 测试直接 import，不依赖 akshare/mootdx 的传递依赖
    "pandas>=2.0",
    "numpy>=1.26",
    # mootdx 把 httpx 钉在 <0.26，此处只要下界，由解析器取交集
    "httpx>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qsys"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
