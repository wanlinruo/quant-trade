[project]
name = "qsys"
version = "0.1.0"
description = "Personal quantitative trading system"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    "pydantic>=2.0",
    "structlog>=24.1",
    "akshare>=1.13",
    "mootdx>=0.11",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    # 测试直接 import，不依赖 akshare/mootdx 的传递依赖
    "pandas>=2.0",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qsys"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
